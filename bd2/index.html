<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Eclipse</title>
    <link rel="stylesheet" href="/library/spine-player.css">
    <script src="/library/preloadjs.min.js"></script>
    <script src="/library/spine-player4.1.js"></script>
    <style>
        * {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft Yahei", "SimHei";
            background-color: black;
            transition: all 1s;
        }

        .main {
            width: 0;
            /* 只做对称轴用途 */
            height: 100%;
            margin: 0 auto;
            position: relative;
            border: 1px green solid;
        }

        .contain {
            width: 100vh;
            height: 100vh;
            position: absolute;
            left: -50vh;
        }
        @media (max-width: 40rem) {
            .contain{
                transform: scale(0.9);
            }
        }

        .chars {
            width: 100%;
            height: 100%;
            position: absolute;
            transition: all .3s;
            z-index: 2;
        }
        .char {
            width: 200%;
            height: 200%;
            left: -50vh;
            top: -58vh;
            position: absolute;
        }


        .interaction {
            width: 0;
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            z-index: 100;
        }
        .interaction span {
            position: absolute;
            border-radius: 50%;
            /* border: 0.2rem lightpink solid; */
            background: center no-repeat;
            background-color: rgba(255, 255, 255, 0.3);
            animation: flick 1s ease-in-out forwards;
        }
        .interaction.hide {
            opacity: 0;
        }
        @keyframes flick {
            100% {
                /* opacity: 0; */
                background-color: rgba(255, 255, 255, 0)
            }
        }
        .talkBox {
            display: none;
            max-width: 100vh;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            padding: 1rem 2rem;
            box-sizing: border-box;
            border-radius: 0.5rem;
            color: white;
            font-weight: bold;
            letter-spacing: 0.5px;
            background-color: rgba(0,0,0,0.5);
            z-index: 200;
        }
        .talkBox.hide {
            display: none !important;
        }
        .talkBox dt {
            position: relative;
            font-size: 1.1rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .talkBox .icon_line {
            position: absolute;
            width: 0.25rem;
            height: 1.2rem;
            right: -1rem;
        }
        .talkBox .tWord {
            line-height: 2rem;
            min-height: 4rem;
            margin-top: 0.5rem;
        }

        .ui {
            width: 100%;
            position: absolute;
            top: 0;
            z-index: 50;
        }
        .ui_top {
            width: 100%;
            position: absolute;
            right: 1rem;
            padding-top: 1rem;
            padding-bottom: 0.5rem;
            background: linear-gradient(rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 1100;
        }
        .ui_top .menu {
            max-width: 100vh;
            margin: auto;
            color: white;
            /* font-family: "Industry-Book"; */
            font-weight: bold;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: flex-end;
        }
        .ui_top .menu span {
            margin: 0 0.25rem;
            display: flex;
            align-items: center;
            cursor: default;
        }
        .ui_top .menu span i {
            width: 1.3rem;
            height: 1.3rem;
            margin: 0 5px;
            pointer-events: none;
        }
        .ui_top .menu span.active {
            color: deepskyblue;
        }
        .ui_top .menu span.btn_area i {
            background:  url("icon/icn_touch.png") no-repeat center;
            background-size: 1.3rem;
        }
        .ui_top .menu span.btn_area.active i {
            background-image:  url("icon/icn_touch_blue.png");
        }
        .ui_top .menu span.btn_talk i {
            background:  url("icon/icn_Chat.png") no-repeat 0 0.1rem;
            background-size: 1.2rem;
        }
        .ui_top .menu span.btn_talk.active i {
            background-image:  url("icon/icn_Chat_blue.png");
        }
        .ui_top .menu span.btn_exit i {
            background:  url("icon/icn_exit.png") no-repeat 0 0.1rem;
            background-size: 1.2rem;
        }

        .posture {
            max-width: 60vh;
            margin: auto;
            position: relative;
        }
        .posture div {
            position: absolute;
            /* right: 0;
            top: 22vh; */
            border: solid rgba(0,0,0,0.5);
            border-width: 0rem 5rem 3rem 1rem;
            border-left-color: transparent;
            /* box-shadow: 3rem 0 2rem 0 #000; */
        }
        .posture span {
            width: 3rem;
            height: 3rem;
            position: absolute;
            right: -4rem;
            top: -1rem;
            border: 2px solid #fff;
            border-radius: 20%;
            background: rgba(0,0,0,0.5) center no-repeat;
            background-size: contain;
            opacity: 0.7;
        }

        #loadingOverlay {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            background-color: black;
            /* opacity: 1; */
            transition: opacity 0.5s;
            /* z-index: 900; */
            z-index: 1200;
        }
        #loadingOverlay .loading_logo {
            width: 10rem;
            height: 10rem;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            /* background: var(--logo) no-repeat; */
            background-size: 10rem;
        }
        #loadingOverlay .progressLine {
            width: 0;
            height: 0.3rem;
            position: absolute;
            bottom: 2rem;
            margin-left: 10vw;
            background-color: white;
            /* transition: all 0.5s; */
        }
        #loadingOverlay .soundOpen {
            display: none;
            width: 100%;
            position: absolute;
            bottom: 25%;
            color: white;
            text-align: center;
            font-weight: bold;
        }
        #loadingOverlay .soundOpen {
            display: block;
            opacity: 0;
        }


        .spine-player canvas.v41 {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <header></header>
    <div class="main">
        <div class="contain">
            <div class="bg"></div>
            <div class="chars"></div>
                <div class="interaction"></div>
        </div>
    </div>
    <div class="talkBox">
        <dl class="talk">
            <dt>
                <i class="icon_line"></i>
                <span class="tName"></span>
            </dt>
            <hr>
            <dd class="tWord"><p>棕色尘埃2</p><p>mod</p></dd>
        </dl>
    </div>
    <div class="ui">
        <div class="posture">
        </div>
        <div class="ui_top">
            <div class="menu">
            <!-- <span class="btn_hide"><i></i>HIDE</span> -->
            <span class="btn_area active"><i></i>AREA</span>
            <span class="btn_talk active"><i></i>TALK</span>
            <span class="btn_exit"><i></i>EXIT</span>
        </div>
        </div>
        <div class="ui_left">
            <div class="movement"></div>
        </div>
        <div class="ui_right">
            <div class="movement"></div>
        </div>
    </div>
    <div id="loadingOverlay" style="opacity: 1;">
        <span class="loading_logo"></span>
        <i class="progressLine"></i>
        <div class="soundOpen" lang-text="open_sound">点击开启声音</div>
    </div>
    <audio id="bgm-player" preload="auto" loop>
        <source type="audio/mpeg">
    </audio>
    <footer></footer>
</body>
</html>
